<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aplikasi Pengolahan Nilai</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f4f6f9;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    width:90%;
    max-width:700px;
    background:white;
    padding:40px;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,0.1);
}

h1{
    text-align:center;
    margin-bottom:10px;
    color:#1f2937;
}

.subtitle{
    text-align:center;
    color:#6b7280;
    margin-bottom:30px;
}

.menu{
    display:grid;
    gap:15px;
}

.menu a{
    display:block;
    text-decoration:none;
    background:#2563eb;
    color:white;
    padding:18px;
    border-radius:10px;
    text-align:center;
    font-size:18px;
    font-weight:bold;
    transition:0.2s;
}

.menu a:hover{
    background:#1d4ed8;
    transform:translateY(-2px);
}

.footer{
    text-align:center;
    margin-top:25px;
    color:#6b7280;
    font-size:14px;
}
</style>
</head>

<div class="container">
