<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generator Nilai Harian</title>

<style>
body{
    font-family: Arial, sans-serif;
    max-width:1200px;
    margin:auto;
    padding:20px;
    background:#f5f5f5;
}

h1{
    text-align:center;
}

.card{
    background:white;
    padding:20px;
    border-radius:10px;
    margin-bottom:20px;
    box-shadow:0 2px 6px rgba(0,0,0,.1);
}

textarea{
    width:100%;
    height:200px;
    padding:10px;
    font-size:14px;
}

button{
    padding:10px 20px;
    margin:5px;
    cursor:pointer;
    border:none;
    border-radius:6px;
    background:#2563eb;
    color:white;
}

button:hover{
    opacity:.9;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
}

th,td{
    border:1px solid #ddd;
    padding:8px;
    text-align:center;
}

th{
    background:#2563eb;
    color:white;
}

.info{
    background:#e8f4ff;
    padding:10px;
    border-radius:6px;
    margin-bottom:10px;
}
</style>
</head>
<body>

<h1>Generator Nilai Harian 1-5</h1>

<div class="card">

<div class="info">
Paste data dari Excel dengan format:
<br><br>
Nama [TAB] UTS [TAB] UAS
<br><br>
Contoh:
<br>
Andi 78 82
<br>
Budi 65 70
</div>

<textarea id="inputData" placeholder="Paste data di sini..."></textarea>

<br><br>

<button onclick="generate()">Generate Nilai</button>
<button onclick="copyTable()">Copy Hasil</button>

</div>

<div class="card">

<table id="resultTable">
<thead>
<tr>
<th>Nama</th>
<th>UTS</th>
<th>UAS</th>
<th>NH1</th>
<th>NH2</th>
<th>NH3</th>
<th>NH4</th>
<th>NH5</th>
</tr>
</thead>
<tbody></tbody>
</table>

</div>

<script>

function batasNilai(nilai){
    return Math.max(0, Math.min(100, Math.round(nilai)));
}

function generate(){

    const data = document.getElementById('inputData').value.trim();
    const tbody = document.querySelector('#resultTable tbody');

    tbody.innerHTML = '';

    if(!data) return;

    const rows = data.split('\n');

    rows.forEach(row => {

        const cols = row.trim().split(/\t|\s+/);

        if(cols.length < 3) return;

        const nama = cols[0];
        const uts = Number(cols[1]);
        const uas = Number(cols[2]);

        const rata = (uts + uas) / 2;

        const nh1 = batasNilai(rata - 2);
        const nh2 = batasNilai(rata + 1);
        const nh3 = batasNilai(rata + 2);
        const nh4 = batasNilai(rata + 3);
        const nh5 = batasNilai(rata);

        tbody.innerHTML += `
        <tr>
            <td>${nama}</td>
            <td>${uts}</td>
            <td>${uas}</td>
            <td>${nh1}</td>
            <td>${nh2}</td>
            <td>${nh3}</td>
            <td>${nh4}</td>
            <td>${nh5}</td>
        </tr>
        `;
    });

}

function copyTable(){

    const table = document.getElementById('resultTable');
    let text = '';

    for(let row of table.rows){

        let rowData = [];

        for(let cell of row.cells){
            rowData.push(cell.innerText);
        }

        text += rowData.join('\t') + '\n';
    }

    navigator.clipboard.writeText(text);

    alert('Hasil berhasil disalin. Tinggal paste ke Excel atau Google Sheets.');
}

</script>

</body>
</html>
