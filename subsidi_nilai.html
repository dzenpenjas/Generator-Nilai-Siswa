<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Subsidi Nilai</title>
<style>
*{
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    max-width:1200px;
    margin:auto;
    padding:20px;
    background:#f5f5f5;
}

h1,h2{
    text-align:center;
}

.card{
    background:white;
    padding:20px;
    border-radius:10px;
    margin-bottom:20px;
    box-shadow:0 2px 6px rgba(0,0,0,.1);
}

.info{
    background:#e8f4ff;
    padding:12px;
    border-radius:6px;
    margin-bottom:15px;
}

.options{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:10px;
}

label{
    display:block;
    margin-bottom:6px;
    font-weight:bold;
}

input,
textarea{
    width:100%;
    padding:10px;
    border:1px solid #ddd;
    border-radius:6px;
    margin-bottom:10px;
}

textarea{
    height:220px;
}

button{
    padding:10px 20px;
    margin:5px 5px 5px 0;
    cursor:pointer;
    border:none;
    border-radius:6px;
    background:#2563eb;
    color:white;
}

button:hover{
    opacity:.92;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
}

th,td{
    border:1px solid #ddd;
    padding:8px;
    text-align:center;
}

th{
    background:#2563eb;
    color:white;
}

pre{
    background:#111;
    color:#00ff66;
    padding:15px;
    border-radius:6px;
    overflow:auto;
    min-height:120px;
    white-space:pre-wrap;
}
</style>
</head>
<body>

<h1>Subsidi Nilai</h1>

<div class="card">
    <label for="kkm">Nilai KKM</label>
    <input id="kkm" type="number" min="0" max="100" value="75">

    <div class="options">
        <div>
            <label for="urutanTampil">Urutan Tampilan</label>
            <select id="urutanTampil">
                <option value="real_desc">Nilai Real Tertinggi</option>
                <option value="subsidi_desc">Nilai Subsidi Tertinggi</option>
                <option value="abjad">Nama A-Z</option>
            </select>
        </div>
    </div>

    <div class="info">
        <b>Format Input:</b><br><br>
        Nama[TAB]Nilai
        <br><br>
        Contoh:
        <br>
        Andi	45
        <br>
        Budi	62
        <br>
        Cici	74
        <br>
        Deni	88
        <br><br>
        (Cukup copy langsung dari Excel atau Google Sheets)
    </div>

    <textarea id="inputData" placeholder="Paste data siswa di sini..."></textarea>

    <button onclick="generateSubsidi()">Generate Subsidi</button>
    <button onclick="copyHasil()">Copy Hasil</button>
</div>

<div class="card">
    <table id="resultTable">
        <thead>
            <tr>
                <th>Nama</th>
                <th>Nilai Asli</th>
                <th>Subsidi</th>
                <th>Nilai Akhir</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

<div class="card">
    <h2>Hasil Copy TAB</h2>
    <pre id="copyOutput"></pre>
</div>

<script>
let hasilData = [];

function clamp(n, min, max){
    return Math.max(min, Math.min(max, n));
}

function random(min, max){
    return Math.floor(Math.random() * (max - min + 1)) + min;
}

function sortForProcessing(items){
    return items.map(item => ({ ...item })).sort((a, b) => {
        if(b.nilai !== a.nilai) return b.nilai - a.nilai;
        return a.nama.localeCompare(b.nama, "id");
    });
}

function sortForDisplay(items){
    const mode = document.getElementById("urutanTampil").value;
    const list = items.map(item => ({ ...item }));

    if(mode === "subsidi_desc"){
        return list.sort((a, b) => {
            if(b.subsidi !== a.subsidi) return b.subsidi - a.subsidi;
            if(b.nilaiAsli !== a.nilaiAsli) return b.nilaiAsli - a.nilaiAsli;
            return a.nama.localeCompare(b.nama, "id");
        });
    }

    if(mode === "abjad"){
        return list.sort((a, b) => a.nama.localeCompare(b.nama, "id"));
    }

    return list.sort((a, b) => {
        if(b.nilaiAsli !== a.nilaiAsli) return b.nilaiAsli - a.nilaiAsli;
        return a.nama.localeCompare(b.nama, "id");
    });
}

function parseRow(row){
    const cols = row.includes("\t")
        ? row.split("\t").map(x => x.trim())
        : row.trim().split(/\s+/);

    if(cols.length < 2) return null;

    const nilai = Number(cols[cols.length - 1]);
    const nama = cols.slice(0, cols.length - 1).join(" ");

    if(!nama || isNaN(nilai)) return null;

    return { nama, nilai };
}

function computeFinalScores(items, kkm){
    const sorted = sortForProcessing(items);
    const subsidiByNilai = {};
    const uniqueNilai = [...new Set(sorted.map(item => item.nilai))];

    uniqueNilai.forEach((nilai, index) => {
        const subsidiMinimal = Math.max(0, kkm - nilai);
        const subsidiBertingkat = subsidiMinimal + index;
        const subsidiMaksimal = Math.max(0, 100 - nilai);

        subsidiByNilai[nilai] = clamp(subsidiBertingkat, 0, subsidiMaksimal);
    });

    return sorted.map(item => {
        const subsidi = subsidiByNilai[item.nilai];
        const nilaiAkhir = clamp(item.nilai + subsidi, 0, 100);

        return {
            nama: item.nama,
            nilaiAsli: item.nilai,
            subsidi,
            nilaiAkhir
        };
    });
}

function generateSubsidi(){
    const kkm = Number(document.getElementById("kkm").value);
    const data = document.getElementById("inputData").value.trim();
    const tbody = document.querySelector("#resultTable tbody");

    hasilData = [];
    tbody.innerHTML = "";

    if(isNaN(kkm)){
        alert("Nilai KKM harus diisi");
        return;
    }

    if(!data){
        document.getElementById("copyOutput").textContent = "";
        return;
    }

    const rows = data.split("\n");
    const parsed = [];

    rows.forEach(row => {
        if(!row.trim()) return;

        const item = parseRow(row);
        if(!item){
            console.warn("Data tidak valid:", row);
            return;
        }

        parsed.push(item);
    });

    hasilData = computeFinalScores(parsed, kkm);

    const tampil = sortForDisplay(hasilData);

    tampil.forEach(item => {
        tbody.innerHTML += `
            <tr>
                <td>${item.nama}</td>
                <td>${item.nilaiAsli}</td>
                <td>${item.subsidi}</td>
                <td>${item.nilaiAkhir}</td>
            </tr>
        `;
    });

    updateCopyOutput();
}

function updateCopyOutput(){
    const lines = [];
    lines.push(["Nama", "Nilai Asli", "Subsidi", "Nilai Akhir"].join("\t"));

    const tampil = sortForDisplay(hasilData);

    tampil.forEach(item => {
        lines.push([
            item.nama,
            item.nilaiAsli,
            item.subsidi,
            item.nilaiAkhir
        ].join("\t"));
    });

    document.getElementById("copyOutput").textContent = lines.join("\n");
}

function copyHasil(){
    const text = document.getElementById("copyOutput").textContent.trim();

    if(!text) return;

    navigator.clipboard.writeText(text);
    alert("Hasil berhasil disalin");
}
</script>
</body>
</html>
