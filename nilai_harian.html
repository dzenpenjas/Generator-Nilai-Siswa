<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generator Nilai Harian</title>

<style>
*{
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    max-width:1200px;
    margin:auto;
    padding:20px;
    background:#f5f5f5;
}

h1,h2{
    text-align:center;
}

.card{
    background:white;
    padding:20px;
    border-radius:10px;
    margin-bottom:20px;
    box-shadow:0 2px 6px rgba(0,0,0,.1);
}

.info{
    background:#e8f4ff;
    padding:12px;
    border-radius:6px;
    margin-bottom:15px;
}

label{
    display:block;
    margin-bottom:6px;
    font-weight:bold;
}

input,
select,
textarea{
    width:100%;
    padding:10px;
    border:1px solid #ddd;
    border-radius:6px;
    margin-bottom:10px;
}

textarea{
    height:180px;
}

button{
    padding:10px 20px;
    margin:5px;
    cursor:pointer;
    border:none;
    border-radius:6px;
    background:#2563eb;
    color:white;
}

button:hover{
    opacity:.9;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
}

th,td{
    border:1px solid #ddd;
    padding:8px;
    text-align:center;
}

th{
    background:#2563eb;
    color:white;
}

pre{
    background:#111;
    color:#00ff66;
    padding:15px;
    border-radius:6px;
    overflow:auto;
    min-height:200px;
    white-space:pre-wrap;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:10px;
}

.options{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:10px;
    align-items:end;
}

.radio-group{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    margin-bottom:10px;
}

.radio-group label{
    display:flex;
    align-items:center;
    gap:6px;
    font-weight:normal;
}

.radio-group input{
    width:auto;
    margin:0;
}

.hidden{
    display:none;
}
</style>
</head>
<body>

<h1>Generator Nilai Harian</h1>

<div class="card">
    <h2>ID Nilai Harian</h2>

    <div class="options">
        <div>
            <label for="jumlahNilai">Jumlah Nilai Harian</label>
            <select id="jumlahNilai" onchange="ubahJumlahNilai()">
                <option value="1">1 Nilai Harian</option>
                <option value="2">2 Nilai Harian</option>
                <option value="3">3 Nilai Harian</option>
                <option value="4">4 Nilai Harian</option>
                <option value="5" selected>5 Nilai Harian</option>
            </select>
        </div>
    </div>

    <div class="grid">
        <input id="id1" class="id-nh" placeholder="ID NH1">
        <input id="id2" class="id-nh" placeholder="ID NH2">
        <input id="id3" class="id-nh" placeholder="ID NH3">
        <input id="id4" class="id-nh" placeholder="ID NH4">
        <input id="id5" class="id-nh" placeholder="ID NH5">
    </div>

    <button onclick="simpanID()">Simpan ID</button>
</div>

<div class="card">
    <h2>Opsi Generate</h2>

    <div class="radio-group">
        <label><input type="radio" name="metodeGenerate" value="uts_uas" checked onchange="ubahMetode()"> Berdasarkan UTS dan UAS</label>
        <label><input type="radio" name="metodeGenerate" value="range" onchange="ubahMetode()"> Berdasarkan Range</label>
    </div>

    <div id="rangeOptions" class="options hidden">
        <div>
            <label for="rangeMin">Nilai Minimum</label>
            <input id="rangeMin" type="number" min="0" max="100" value="70">
        </div>
        <div>
            <label for="rangeMax">Nilai Maksimum</label>
            <input id="rangeMax" type="number" min="0" max="100" value="85">
        </div>
        <div>
            <label for="avgMin">Rata-rata Target Minimum</label>
            <input id="avgMin" type="number" min="0" max="100" value="77">
        </div>
        <div>
            <label for="avgMax">Rata-rata Target Maksimum</label>
            <input id="avgMax" type="number" min="0" max="100" value="82">
        </div>
    </div>

    <div class="info">
        <b>Format Input:</b><br><br>
        Nama[TAB]UTS[TAB]UAS
        <br><br>
        Contoh:
        <br>
        Andi 80 90
        <br>
        Budi 75 85
        <br><br>
        (Cukup copy langsung dari Excel atau Google Sheets)
    </div>

    <textarea id="inputData" placeholder="Paste data di sini..."></textarea>

    <button onclick="generate()">Generate Nilai</button>
    <button onclick="copyTable()">Copy Hasil</button>
</div>

<div class="card">
    <table id="resultTable">
        <thead>
            <tr id="headerRow">
                <th>Nama</th>
                <th>UTS</th>
                <th>UAS</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

<div class="card">
    <h2>Generate Script</h2>

    <select id="pilihSiswa">
        <option value="">-- Pilih Siswa --</option>
    </select>

    <button onclick="generateScript()">Generate Script</button>
    <button onclick="copyScript()">Copy Script</button>

    <pre id="scriptOutput"></pre>
</div>

<script>
let siswaData = [];
let jumlahNilai = 5;

window.onload = () => {
    jumlahNilai = Number(localStorage.getItem("jumlahNilai")) || 5;
    document.getElementById("jumlahNilai").value = jumlahNilai;

    for(let i=1;i<=5;i++){
        document.getElementById("id"+i).value = localStorage.getItem("id"+i) || "";
    }

    ubahJumlahNilai(false);
    ubahMetode();
};

function simpanID(){
    for(let i=1;i<=5;i++){
        localStorage.setItem("id"+i, document.getElementById("id"+i).value);
    }

    alert("ID berhasil disimpan");
}

function ubahJumlahNilai(regenerate = true){
    jumlahNilai = Number(document.getElementById("jumlahNilai").value);
    localStorage.setItem("jumlahNilai", jumlahNilai);

    document.querySelectorAll(".id-nh").forEach((input,index)=>{
        input.classList.toggle("hidden", index >= jumlahNilai);
    });

    updateTableHeader();

    if(regenerate && document.getElementById("inputData").value.trim()){
        generate();
    }
}

function ubahMetode(){
    const metode = getMetodeGenerate();
    document.getElementById("rangeOptions").classList.toggle("hidden", metode !== "range");
}

function updateTableHeader(){
    const headerRow = document.getElementById("headerRow");
    headerRow.innerHTML = "<th>Nama</th><th>UTS</th><th>UAS</th>";

    for(let i=1;i<=jumlahNilai;i++){
        headerRow.innerHTML += `<th>NH${i}</th>`;
    }
}

function batasNilai(nilai){
    nilai = Math.round(nilai);

    if(nilai < 70) return 70;
    if(nilai > 90) return 90;

    return nilai;
}

function random(min,max){
    return Math.floor(Math.random()*(max-min+1)) + min;
}

function getMetodeGenerate(){
    return document.querySelector('input[name="metodeGenerate"]:checked').value;
}

function getRangeNilai(){
    let min = Number(document.getElementById("rangeMin").value);
    let max = Number(document.getElementById("rangeMax").value);
    let avgMin = Number(document.getElementById("avgMin").value);
    let avgMax = Number(document.getElementById("avgMax").value);

    if(isNaN(min)) min = 70;
    if(isNaN(max)) max = 85;
    if(isNaN(avgMin)) avgMin = 77;
    if(isNaN(avgMax)) avgMax = 82;

    min = Math.max(0, Math.min(100, Math.round(min)));
    max = Math.max(0, Math.min(100, Math.round(max)));
    avgMin = Math.max(0, Math.min(100, Math.round(avgMin)));
    avgMax = Math.max(0, Math.min(100, Math.round(avgMax)));

    if(min > max){
        const temp = min;
        min = max;
        max = temp;
    }

    if(avgMin > avgMax){
        const temp = avgMin;
        avgMin = avgMax;
        avgMax = temp;
    }

    return { min, max, avgMin, avgMax };
}

function clamp(n, min, max){
    return Math.max(min, Math.min(max, n));
}

function buatNilaiDenganTarget(ukuran, min, max, target){
    const nilai = [];

    if(ukuran <= 0) return nilai;

    if(ukuran === 1){
        return [clamp(target, min, max)];
    }

    let totalTarget = target * ukuran;
    let totalSaatIni = 0;

    for(let i=0;i<ukuran-1;i++){
        const deviasi = random(-2, 2);
        const angka = clamp(target + deviasi, min, max);
        nilai.push(angka);
        totalSaatIni += angka;
    }

    let terakhir = totalTarget - totalSaatIni;
    terakhir = clamp(Math.round(terakhir), min, max);
    nilai.push(terakhir);

    let rataActual = nilai.reduce((a,b)=>a+b,0) / nilai.length;
    let selisih = Math.round((target - rataActual) * nilai.length);

    while(selisih !== 0){
        let berubah = false;

        for(let i=0;i<nilai.length && selisih !== 0;i++){
            const arah = selisih > 0 ? 1 : -1;
            const baru = clamp(nilai[i] + arah, min, max);

            if(baru !== nilai[i]){
                nilai[i] = baru;
                selisih -= arah;
                berubah = true;
            }
        }

        if(!berubah) break;
    }

    return nilai;
}

function buatNilaiHarian(uts, uas){
    const metode = getMetodeGenerate();
    const nilaiHarian = [];

    if(metode === "range"){
        const range = getRangeNilai();
        const targetAvg = random(range.avgMin, range.avgMax);
        return buatNilaiDenganTarget(jumlahNilai, range.min, range.max, targetAvg);
    }

    let rata = Math.round((uts + uas)/2);
    rata = batasNilai(rata);

    for(let i=0;i<jumlahNilai;i++){
        nilaiHarian.push(batasNilai(rata + random(-3,3)));
    }

    return nilaiHarian;
}

function parseRow(row){
    const cols = row.includes("\t")
        ? row.split("\t").map(x => x.trim())
        : row.trim().split(/\s+/);

    if(cols.length < 3) return null;

    const uas = Number(cols[cols.length - 1]);
    const uts = Number(cols[cols.length - 2]);
    const nama = cols.slice(0, cols.length - 2).join(" ");

    if(!nama || isNaN(uts) || isNaN(uas)) return null;

    return { nama, uts, uas };
}

function generate(){
    const data = document.getElementById("inputData").value.trim();

    if(!data) return;

    siswaData = [];

    const tbody = document.querySelector("#resultTable tbody");
    tbody.innerHTML = "";

    const rows = data.split("\n");

    rows.forEach(row=>{
        const parsed = parseRow(row);

        if(!parsed) return;

        const nilaiHarian = buatNilaiHarian(parsed.uts, parsed.uas);

        siswaData.push({
            nama: parsed.nama,
            uts: parsed.uts,
            uas: parsed.uas,
            nilaiHarian
        });

        const kolomNilai = nilaiHarian.map(nilai=>`<td>${nilai}</td>`).join("");

        tbody.innerHTML += `
            <tr>
                <td>${parsed.nama}</td>
                <td>${parsed.uts}</td>
                <td>${parsed.uas}</td>
                ${kolomNilai}
            </tr>
        `;
    });

    updateDropdown();
}

function updateDropdown(){
    const select = document.getElementById("pilihSiswa");
    select.innerHTML = '<option value="">-- Pilih Siswa --</option>';

    siswaData.forEach((s,index)=>{
        select.innerHTML += `
            <option value="${index}">
                ${s.nama}
            </option>
        `;
    });
}

function generateScript(){
    const idx = document.getElementById("pilihSiswa").value;

    if(idx === ""){
        alert("Pilih siswa terlebih dahulu");
        return;
    }

    const s = siswaData[idx];
    const nilai = {};

    for(let i=1;i<=jumlahNilai;i++){
        const id = document.getElementById("id"+i).value.trim();

        if(!id) continue;

        nilai[id] = s.nilaiHarian[i-1];
    }

    if(Object.keys(nilai).length === 0){
        alert("Isi minimal 1 ID Nilai Harian terlebih dahulu");
        return;
    }

    const nilaiLines = Object.entries(nilai).map(([id, skor])=>{
        return `  "${id}": ${skor}`;
    }).join(",\n");

    const script = `const nilai = {
${nilaiLines}
};

for (const [id, skor] of Object.entries(nilai)) {
  const el = document.querySelector(
    \`input[name="nilai#sumatif1#\${id}"]\`
  );

  if (!el) continue;

  el.value = skor;
  el.dispatchEvent(new Event('input', { bubbles: true }));
  el.dispatchEvent(new Event('change', { bubbles: true }));
}`;

    document.getElementById("scriptOutput").textContent = script;
}

function copyScript(){
    const text = document.getElementById("scriptOutput").textContent;

    if(!text) return;

    navigator.clipboard.writeText(text);

    alert("Script berhasil disalin");
}

function copyTable(){
    const table = document.getElementById("resultTable");
    let text = "";

    for(let row of table.rows){
        let rowData = [];

        for(let cell of row.cells){
            rowData.push(cell.innerText);
        }

        text += rowData.join("\t") + "\n";
    }

    navigator.clipboard.writeText(text);

    alert("Tabel berhasil disalin");
}
</script>
</body>
</html>
